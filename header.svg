<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">RepoDoc</title>
  <desc id="dsc">Understand any codebase - grounded in the source, every answer cited.</desc>

  <!-- flat surface -->
  <rect width="1200" height="360" rx="16" fill="#0D0D0F"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="16" y="1" width="1168" height="1" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- top meta row -->
  <text x="72" y="46" fill="#8A8A90" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="500" letter-spacing="3">CODEBASE INTELLIGENCE</text>
  <text x="1108" y="46" text-anchor="end" fill="#7A7A80" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace" font-size="13"><tspan fill="#5E5E64">$ </tspan>repodoc ask</text>
  <rect x="1116" y="34" width="8" height="15" fill="#C7C8CE">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <line x1="72" y1="68" x2="1128" y2="68" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- wordmark -->
  <text x="70" y="184" fill="#F4F4F6" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="88" font-weight="700" letter-spacing="-3.5">RepoDoc</text>

  <!-- tagline -->
  <text x="74" y="226" fill="#9C9CA4" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="21" font-weight="400">Understand any codebase - grounded in the source, every answer cited.</text>

  <!-- divider -->
  <line x1="72" y1="272" x2="1128" y2="272" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- spec row -->
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace">
    <text x="72" y="304" fill="#6A6A70" font-size="11" letter-spacing="2">RETRIEVAL</text>
    <text x="72" y="326" fill="#C7C8CE" font-size="14">pgvector · 768-dim</text>

    <text x="356" y="304" fill="#6A6A70" font-size="11" letter-spacing="2">INDEXING</text>
    <text x="356" y="326" fill="#C7C8CE" font-size="14">Postgres lease queue</text>

    <text x="640" y="304" fill="#6A6A70" font-size="11" letter-spacing="2">COST</text>
    <text x="640" y="326" fill="#C7C8CE" font-size="14">per-project budgets</text>

    <text x="900" y="304" fill="#6A6A70" font-size="11" letter-spacing="2">ANSWERS</text>
    <text x="900" y="326" fill="#C7C8CE" font-size="14">grounded · cited</text>
  </g>

  <!-- column separators -->
  <g stroke="#FFFFFF" stroke-opacity="0.08">
    <line x1="330" y1="290" x2="330" y2="330"/>
    <line x1="614" y1="290" x2="614" y2="330"/>
    <line x1="874" y1="290" x2="874" y2="330"/>
  </g>
</svg>
